<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parking Management System - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #1e3c72;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #2a5298;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 45px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 12px;
            cursor: pointer;
            font-size: 18px;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1e3c72;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #2a5298;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            color: red;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">🚗</div>

        <h1>Parking Management System</h1>

        <p class="subtitle">Admin Login</p>

        <form onsubmit="login(event)">

            <!-- Username -->
            <div class="input-group">
                <label>Username</label>

                <input type="text" id="username" placeholder="Enter username" required>
            </div>

            <!-- Password -->
            <div class="input-group">
                <label>Password</label>

                <div class="password-box">

                    <input type="password" id="password" placeholder="Enter password" required>

                    <span class="show-password" onclick="showPassword()">
                        👁️
                    </span>

                </div>
            </div>

            <!-- Login button -->
            <button type="submit" class="login-btn">

                Login
            </button>

            <p id="message"></p>

        </form>

        <div class="footer">
            © 2026 Parking Management System
        </div>

    </div>
    <script>
        function login(event) {
            event.preventDefault();

            let username = document.getElementById("username").value.trim();
            let password = document.getElementById("password").value.trim();

            if (username === "admin" && password === "1234") {

                localStorage.setItem("isLoggedIn", "true");

                alert("Login successful!");

                window.location.href = "index.html";

            } else {

                document.getElementById("message").innerText =
                    "Invalid username or password!";

            }
        }

        function showPassword() {
            let password = document.getElementById("password");

            if (password.type === "password") {
                password.type = "text";
            } else {
                password.type = "password";
            }
        }
    </script>


</body>

</html>
